<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>@font-face{font-family:'DM Sans';font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'Playfair Display';font-weight:900;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'Playfair Display';font-weight:400;font-style:italic;src:url(data:font/woff2;base64,) format('woff2')}
.up{animation:up 1s cubic-bezier(.2,.8,.2,1) both}
.u1{animation-delay:.1s}.u2{animation-delay:.25s}.u3{animation-delay:.4s}.u4{animation-delay:.55s}.u5{animation-delay:.7s}.u6{animation-delay:.85s}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.drift{animation:drift 22s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.d1{animation-duration:28s;animation-delay:-8s}.d2{animation-duration:32s;animation-delay:-14s}.d3{animation-duration:26s;animation-delay:-4s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,30px) scale(1.08)}100%{transform:translate(-40px,50px) scale(.95)}}
.ping{animation:ping 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{0%{transform:scale(1);opacity:.6}100%{transform:scale(3.2);opacity:0}}
</style><defs><linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat">
